name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Takeout-Parser
        run: python tests/test_takeout.py
      - name: Build mit Demo-Daten
        run: python tests/test_build.py
        env:
          PYTHONIOENCODING: utf-8
      - name: JavaScript-Syntax
        shell: bash
        run: for f in web/*.js; do node --check "$f"; done
